<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Steam ML Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <h2>AI Game Recommender 🎮</h2>
                <p class="text-muted">Znajdź nowe gry na podstawie tych, w które grałeś najdłużej.</p>
                <form action="/recommend" method="POST" class="mt-4">
                    <div class="mb-3">
                        <label for="steam_id" class="form-label">Twój Steam ID (64-bitowy ciąg cyfr):</label>
                        <input type="text" class="form-control" id="steam_id" name="steam_id" placeholder="np. 76561197960287930" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analizuj za pomocą Machine Learning</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
